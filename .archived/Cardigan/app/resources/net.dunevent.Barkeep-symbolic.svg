<svg width="16" height="16" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Cardigan symbolic icon</title>
<desc>Monochrome 16x16 symbolic version of the app icon for use at small sizes (16-24px) and in contexts like the top bar or HighContrast theme, per the GNOME HIG. Reuses the full-size icon's metaphor (a fanned set of cards, the front one showing a barcode) with three cards fanned at increasing angles from a shared left-edge origin, echoing the full-size icon's three-card fan. The middle card is stroke-only (hollow) with a real hole masked through the solid card behind it so its window shows true background rather than whatever's drawn behind it in z-order. The barcode is the 11-bit pattern 10110100101 (1 = clear line, 0 = dark line) punched through all three cards via a shared mask, centered vertically with an equal 2.5px margin above and below.</desc>
<defs>
<!-- The barcode gaps need to show true background even where the back
     card sits behind the front card, cutting the gaps only into the
     front path lets the back card show through underneath instead of
     real transparency, so both cards are drawn inside a masked group
     instead, with the gaps punched through the mask itself.

     Gaps encode the bit pattern 10110100101 (1 = clear line, 0 = dark
     line) across the 11 unit-wide columns available in the front
     card's 13px width once its 1px corner margin is excluded on each
     side. Adjacent 1-bits (columns 2 and 3) are merged into one wider
     rect rather than drawn as two abutting ones. Vertically, the gaps
     are centered with an equal 2.5px margin above and below within
     the front card's 9px height (trimmed 1px off each end from the
     previous 1.5px margin/6px line length). -->
<mask id="gap-mask">
<rect x="0" y="0" width="16" height="16" fill="#ffffff"/>
<rect x="2" y="7.5" width="1" height="4" fill="#000000"/>
<rect x="4" y="7.5" width="2" height="4" fill="#000000"/>
<rect x="7" y="7.5" width="1" height="4" fill="#000000"/>
<rect x="10" y="7.5" width="1" height="4" fill="#000000"/>
<rect x="12" y="7.5" width="1" height="4" fill="#000000"/>
</mask>
<!-- The middle card's hollow window needs the same real-transparency
     treatment as the barcode gaps above, rather than just being an
     unfilled path, an unfilled path only reveals whatever happens to
     be drawn behind it in z-order (now the third card's solid fill),
     it doesn't punch an actual hole. This mask is white everywhere
     except the middle card's own silhouette (same path + rotation as
     the middle card itself), and gets applied to the third card alone,
     so the third card has a true hole cut in exactly that shape and
     shows real background there no matter what, the same way the
     barcode gaps do for the cards as a whole. -->
<mask id="middle-hole-mask">
<rect x="0" y="0" width="16" height="16" fill="#ffffff"/>
<path fill="#000000" d="M3.3,5 L13.7,5 A1.3,1.3 0 0 1 15,6.3 L15,12.7 A1.3,1.3 0 0 1 13.7,14 L3.3,14 A1.3,1.3 0 0 1 2,12.7 L2,6.3 A1.3,1.3 0 0 1 3.3,5 Z" transform="rotate(-12 2 9.5)"/>
</mask>
</defs>
<g mask="url(#gap-mask)">
<!-- Third (furthest-back) card, continuing the fan at a steeper angle
     than the middle card, drawn first so it's behind both others.
     Solid fill like the front card rather than outline, since one more
     hollow layer would just read as clutter. Same base rect as the
     middle card (same origin idea, same pivot convention), just
     rotated further, three cards at increasing angles echoes the
     full-size icon's three-card fan more closely than two ever did.
     Wrapped in its own masked group (middle-hole-mask) so the middle
     card's window stays a real hole through it, then the whole thing
     is inside the outer masked group so the barcode gaps still cut
     through it exactly like the other two cards. -->
<g mask="url(#middle-hole-mask)">
<path fill="#2e3436" d="M3.3,5 L13.7,5 A1.3,1.3 0 0 1 15,6.3 L15,12.7 A1.3,1.3 0 0 1 13.7,14 L3.3,14 A1.3,1.3 0 0 1 2,12.7 L2,6.3 A1.3,1.3 0 0 1 3.3,5 Z" transform="rotate(-24 2 9.5)"/>
</g>
<!-- Back card (same size as front), fanned out at a shallow angle from
     its own left edge, mirroring the full-size icon's rotation about a
     pivot on the card's left side rather than just being offset
     up-left with no rotation. Moved down from its first position so
     its top-left corner sits close to the front card's top-left
     corner instead of well above-and-left of it, again matching how
     the full icon's cards share a common origin rather than spreading
     apart in both x and y. Stroke-only (no fill) so it reads as a
     hollow card behind the solid front one. -->
<path fill="none" stroke="#2e3436" stroke-width="1" d="M3.3,5 L13.7,5 A1.3,1.3 0 0 1 15,6.3 L15,12.7 A1.3,1.3 0 0 1 13.7,14 L3.3,14 A1.3,1.3 0 0 1 2,12.7 L2,6.3 A1.3,1.3 0 0 1 3.3,5 Z" transform="rotate(-12 2 9.5)"/>
<!-- Front card -->
<path fill="#2e3436" d="M2.3,5 L12.7,5 A1.3,1.3 0 0 1 14,6.3 L14,12.7 A1.3,1.3 0 0 1 12.7,14 L2.3,14 A1.3,1.3 0 0 1 1,12.7 L1,6.3 A1.3,1.3 0 0 1 2.3,5 Z"/>
</g>
</svg>
