[package]
name = "cardigan"
version = "0.1.0"
edition = "2021"
description = "A privacy-friendly loyalty card wallet for the Phosh mobile shell"
license = "GPL-3.0-or-later"

[dependencies]
cardigan-core = { path = "../cardigan-core" }
gtk = { version = "0.9", package = "gtk4", features = ["v4_12"] }
adw = { version = "0.7", package = "libadwaita", features = ["v1_5"] }
uuid = { version = "1", features = ["v4", "serde"] }
gstreamer = "0.23"
gstreamer-app = "0.23"
gstreamer-video = "0.23"
# XDG portal access (specifically the camera portal -- see camera.rs's
# own doc comment for the full reasoning). async-io feature, not tokio
# -- nothing else in this app uses an async runtime at all, so this
# avoids pulling in a whole, separate executor just for one portal
# call; ashpd's own futures are run to completion via
# async_io::block_on(...) directly from the existing background
# thread, not a persistent runtime.
ashpd = { version = "0.13", default-features = false, features = ["async-io", "camera"] }
# async_io::block_on is called directly in camera.rs (to run ashpd's own
# async portal calls to completion from the existing background thread)
# -- needed as its own, direct dependency, not just relying on it as a
# transitive dependency pulled in by ashpd's own async-io feature above,
# since Rust doesn't allow using a transitive dependency's API directly
# without declaring it.
async-io = "2"
# zbus's blocking API (zbus::blocking) runs its own internal executor, so
# this doesn't pull in tokio or another async runtime. Used directly here
# for camera.rs's own iio-sensor-proxy accelerometer queries (orientation
# tracking) -- separate from cardigan-core's own zbus usage for logind
# brightness control. If 4.x has been superseded by the time this builds,
# check crates.io/crates/zbus for the current major.
zbus = "4"

# Reconstructed here -- this section was missing from the Cargo.toml
# snapshot read earlier this session, which in hindsight was very
# likely an incomplete/stale upload rather than this project's real,
# working file (build.rs has clearly been compiling successfully all
# session, and it needs exactly this crate to do so at all). Version
# confirmed directly against the official gtk4-rs repository's own
# example Cargo.toml, which pins the exact same gtk4/libadwaita
# versions this project already uses.
[build-dependencies]
glib-build-tools = "0.20"

# Built via cargo-deb (https://github.com/kornelski/cargo-deb, the
# actual crates.io package that name installs -- confirmed directly
# against that specific repo's own Cargo.toml after finding a
# similarly-named but different, apparently less-maintained project at
# the same command name; not the official Debian Rust Team's own
# dh-cargo/debcargo tooling, which explicitly doesn't support
# workspaces at all per two independent official Debian sources).
# Invoke from the workspace root as:
#   cargo deb -p cardigan
# (cardigan is this crate's own [package] name -- cargo-deb's own docs
# confirm -p selects which crate's manifest supplies the package-level
# metadata below).
#
# Just this crate's own binary now -- the lock-screen plugin
# (cardigan-lockscreen, cardigan-lockscreen-prefs) used to be packaged
# into this same .deb too, but that's paused (see the root Cargo.toml's
# own default-members comment) to focus on shipping the main app first.
# Both crates are still genuine workspace members, not deleted or
# split into a separate repo -- just no longer part of what this .deb
# installs, so this app no longer needs phosh-plugins as a runtime
# dependency (it isn't a Phosh plugin itself, only ever needed it
# because this .deb used to also install one), and no longer needs the
# maintainer-scripts' own glib-compile-schemas step (that existed only
# to compile the lock-screen plugin's own GSettings schema, not
# anything this app itself uses). Revisit both -- restoring the
# lock-screen assets/depends/maintainer-scripts here, or moving them to
# their own, separate .deb entirely -- whenever that work resumes.
[package.metadata.deb]
maintainer = "AJ Dunevent <aj@dunevent.net>"
copyright = "2026, AJ Dunevent <aj@dunevent.net>"
assets = [
    ["target/release/cardigan", "usr/bin/", "755"],
    # App-launcher integration -- separate from resources/cardigan.gresource.xml's
    # own in-app UI icons (compiled directly into the binary via
    # glib-build-tools, a completely different mechanism), since Phosh
    # itself needs to find and display this icon before the app has ever
    # run at all, which only works via plain, standalone files on disk
    # under the standard freedesktop.org hicolor icon theme paths, not
    # anything embedded in the binary. Destination filenames renamed
    # from the source files' own underscore-based names (net_dunevent_
    # Cardigan[-symbolic].svg) to match the real app ID exactly, dots
    # not underscores (net.dunevent.Cardigan) -- required for the
    # .desktop file's own Icon=net.dunevent.Cardigan line to actually
    # resolve via icon theme lookup, which matches by exact name.
    ["resources/net.dunevent.Cardigan.desktop", "usr/share/applications/", "644"],
    ["resources/net_dunevent_Cardigan.svg", "usr/share/icons/hicolor/scalable/apps/net.dunevent.Cardigan.svg", "644"],
    ["resources/net_dunevent_Cardigan-symbolic.svg", "usr/share/icons/hicolor/symbolic/apps/net.dunevent.Cardigan-symbolic.svg", "644"],
]
