[package]
name = "cardigan-lockscreen"
version = "0.1.0"
edition = "2021"
description = "Phosh lock-screen plugin for Cardigan -- shows a filtered list of loyalty cards on the lock screen, read-only. Loaded by Phosh itself as a GIOModule; not a standalone binary."
license = "GPL-3.0-or-later"

[lib]
# cdylib: this needs to produce a plain .so GModule can dlopen and call
# g_io_module_load/g_io_module_unload/g_io_<name>_query on by symbol
# name (confirmed from plugins/ticket-box's own phosh-plugin-ticket-box.c
# and plugins/meson.build's own `shared_module(...)` call) -- not an rlib
# (nothing else links against this crate directly) and not a normal
# `dylib` (which carries Rust-specific ABI metadata GModule has no use
# for and no way to interpret).
crate-type = ["cdylib"]

[dependencies]
cardigan-core = { path = "../cardigan-core" }
# Same gtk4/libadwaita versions as the main app's own Cargo.toml --
# not a forced match to anything. This plugin doesn't depend on
# libphosh-rs at all: the real plugins/ticket-box.c and
# plugins/launcher-box.c source (confirmed directly, not assumed) only
# #include "phosh-plugin.h" (six string constants, see lib.rs's own doc
# comment) plus standard <gtk/gtk.h>/<gio/gio.h> -- libphosh-rs's own
# Shell/Lockscreen subclassing API is for a different thing entirely
# (replacing Phosh's own shell process, like phrog), not this
# GIOModule-based extension-point system. So there's no version floor
# imposed by libphosh-rs to match here; reusing the main app's own,
# already-working versions is just the lower-risk default, since this
# plugin runs as its own separate process either way and could use a
# different version without any actual conflict.
gtk = { version = "0.9", package = "gtk4", features = ["v4_12"] }
adw = { version = "0.7", package = "libadwaita", features = ["v1_5"] }
gio = "0.20"
glib = "0.20"
# Same version as cardigan-core's own -- Cargo unifies this into one
# actual compiled version across the workspace regardless. Needed
# directly here (not just transitively via cardigan-core's own
# Card::group_ids: Vec<Uuid>) to parse the UUID strings this plugin's
# own GSettings group-ids key stores.
uuid = { version = "1", features = ["v4", "serde"] }
