[package]
name = "cardigan-core"
version = "0.1.0"
edition = "2021"
description = "Shared, GTK-free logic for Cardigan: card/group data model, JSON persistence, barcode encode/decode, and brightness control. Used by both the main Cardigan app and the Phosh lock-screen plugin -- kept free of gtk4/libadwaita/gstreamer dependencies specifically so it doesn't force both consumers onto the same gtk-rs version (libphosh-rs pins an older one than the main app uses)."
license = "GPL-3.0-or-later"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "5"
rxing = "0.5"
image = "0.25"
csv = "1"
zip = "2"
tar = "0.4"
flate2 = "1"
bzip2 = "0.5"
# zbus's blocking API (zbus::blocking) runs its own internal executor, so
# this doesn't pull in tokio or another async runtime. If 4.x has been
# superseded by the time this builds, check crates.io/crates/zbus for the
# current major.
zbus = "4"
