[package]
name = "barkeep-core"
version = "0.1.1"
edition = "2021"
description = "Shared, GTK-free logic for Barkeep: card and group data model, JSON persistence, and barcode encode/decode."
license = "GPL-3.0-or-later"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "5"
rxing = "0.5"
image = "0.25"
csv = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
