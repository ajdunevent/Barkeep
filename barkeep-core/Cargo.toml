[package]
name = "barkeep-core"
version = "0.1.0"
edition = "2021"
description = "Shared, GTK-free logic for Barkeep: card/group data model, JSON persistence, and barcode encode/decode. Used by both the main Barkeep app and the Phosh lock-screen plugin -- kept free of gtk4/libadwaita/gstreamer dependencies specifically so it doesn't force both consumers onto the same gtk-rs version (libphosh-rs pins an older one than the main app uses)."
license = "GPL-3.0-or-later"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "5"
rxing = "0.5"
image = "0.25"
csv = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
