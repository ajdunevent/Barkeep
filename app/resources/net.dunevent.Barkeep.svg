<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Barkeep app icon draft 18</title>
<desc>Three rounded rectangular cards fanned from a pivot on the left, front card flat, the two behind angling upward with widening gaps. Each card's wall is one explicit closed path built by exactly connecting every point on the exposed portion of the card's own perimeter to that same point shifted by one fixed global vector (straight down, identical for all three cards regardless of tilt). Each wall is filled with a gradient of its own color, brightening into a lighter tint near whichever corner is actually visible once the cards in front are drawn (only the near/right tip for the two rotated cards, the other end of their wall sits mostly hidden behind the pivot and is not a corner anyone would see, and both ends for the flat front card, which are both genuinely visible corners), fading back to the base color, to read as a curved, three-dimensional surface. The whole composition is wrapped in a single scale+translate transform (see the comment at the start of the visible content) that recenters it and fills more of the canvas, since the artwork's natural bounding box left very uneven margins (15.25/21/11.25/35.375 on left/right/top/bottom) that made it look small and off-center next to other icons.</desc>
<defs>
<linearGradient id="red" x1="23" y1="38" x2="23" y2="90" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#ff7b63"/>
<stop offset="1" stop-color="#e01b24"/>
</linearGradient>
<linearGradient id="green" x1="23" y1="38" x2="23" y2="90" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#2f9660"/>
<stop offset="1" stop-color="#1b6b43"/>
</linearGradient>
<linearGradient id="purple" x1="23" y1="38" x2="23" y2="90" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#c061cb"/>
<stop offset="1" stop-color="#9141ac"/>
</linearGradient>

<!--
  Purple's wall gradient (both ends genuinely visible, per Passes'
  "c" gradient): base color held through the middle, brightening into
  a lighter tint of the same hue near each end, then fading back to
  base, using x1/y1/x2/y2 set to its own two wall-path endpoints so
  the brightened band lands exactly at each corner.

  Red/green's wall highlights are radial gradients, but their center
  points are NOT a theoretical corner point computed from the rect's
  geometry alone. Only a sliver of each corner survives being drawn
  over by the cards in front, and that sliver's actual position and
  shape (measured directly from a rendered composite: which pixels are
  inside the wall path, outside the front face, and not covered by the
  cards drawn after it) turned out not to match where clean geometry
  says the corner apex should be. cx/cy below are that measured
  centroid in local coordinates, and r is sized to comfortably cover
  the measured extent of the visible sliver around it.
-->
<radialGradient id="red-wall" cx="102.279" cy="89.142" r="5" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#ff7b63"/>
<stop offset="1" stop-color="#9a0f0f"/>
</radialGradient>
<radialGradient id="green-wall" cx="103.139" cy="88.576" r="5" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#2f9660"/>
<stop offset="1" stop-color="#0f4a2e"/>
</radialGradient>
<linearGradient id="purple-wall" x1="105.000" y1="83.000" x2="23.000" y2="83.000" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#632a73"/>
<stop offset="0.047" stop-color="#c061cb"/>
<stop offset="0.1" stop-color="#632a73"/>
<stop offset="0.9" stop-color="#632a73"/>
<stop offset="0.954" stop-color="#c061cb"/>
<stop offset="1" stop-color="#632a73"/>
</linearGradient>
</defs>

<!--
  Everything below is wrapped in one scale+translate transform to
  recenter and enlarge the composition within the 128x128 canvas. The
  artwork's own natural bounding box (measured from an actual render,
  not computed from the path coordinates by hand, since the rotated
  cards make that error-prone) was x 15.25-107, y 11.25-92.625: a
  91.75x81.375 block sitting with very uneven margins (15.25 left vs 21
  right, 11.25 top vs 35.375 bottom) inside a much bigger square. That
  unevenness, more than the empty space itself, is why it read as
  small and adrift next to other icons.

  scale(1.227684) brings the larger dimension (width) up to 88% of the
  canvas; translate(-11.042,0.237) then shifts the result so the
  content's own center lands exactly on the canvas center (64,64)
  rather than wherever the original artwork happened to place it.
  Verified after the fact by re-measuring a render of this file: the
  new bounding box is x 7.68-120.32 (7.68px margin, equal both sides)
  and y 14.05-113.95 (14.05px margin, equal both sides).
-->
<g transform="translate(-11.042,0.237) scale(1.227684)">

<!--
  Card geometry shared by all three cards: an 82x52 rounded rect (rx 7)
  fanned from pivot (23,64). Every card's wall uses the exact same
  global vector, straight down 4 units in the final image, regardless of
  that card's own rotation.

  Each wall path below is precomputed (not hand-drawn) in that card's
  own local, pre-rotation coordinates, then rotated together with the
  front face by the same theta via transform="rotate(theta 23 64)". The
  local coordinates are deliberately NOT simply "shift everything down
  4", that would only equal a global vertical shift for the unrotated
  (purple) card. For a rotated card, the correct local shift is the
  global down-vector rotated by -theta (undoing the transform this path
  is about to receive), so that after the shared rotate() is applied,
  every one of these paths ends up offset by the exact same 4-unit
  straight-down vector on screen, matching purple's.

  Because a fixed global direction is generally not aligned with any
  single edge of a rotated rectangle, the boundary whose outward normal
  faces that direction is not just the bottom edge for red/green, it
  also includes part of the trailing side edge and the corner between
  them. Each path traces exactly that exposed run (computed from where
  the rotated normal crosses perpendicular-to-the-offset, i.e. the true
  edge of visibility), connects to the same run shifted by the local
  vector, and closes, so every point on the front run has a real
  straight connector to its counterpart on the back run, not an
  incidental overlap between two separately-drawn shapes.
-->

<!-- Red card (back of the fan), theta = -22 -->
<path d="M 104.490,85.622 A 7,7 0 0 1 98.000,90.000 L 30.000,90.000 A 7,7 0 0 1 23.000,83.000 L 23.000,45.000 A 7,7 0 0 1 23.510,42.378 L 22.511,44.850 A 7,7 0 0 0 22.001,47.472 L 22.001,85.472 A 7,7 0 0 0 29.001,92.472 L 97.001,92.472 A 7,7 0 0 0 103.491,88.095 Z"
      fill="url(#red-wall)" transform="rotate(-22 23 64)"/>
<rect x="23" y="38" width="82" height="52" rx="7" fill="url(#red)"
      transform="rotate(-22 23 64)"/>

<!-- Green card (middle), theta = -9 -->
<path d="M 104.914,84.095 A 7,7 0 0 1 98.000,90.000 L 30.000,90.000 A 7,7 0 0 1 23.000,83.000 L 23.000,45.000 A 7,7 0 0 1 23.086,43.905 L 22.669,46.539 A 7,7 0 0 0 22.583,47.634 L 22.583,85.634 A 7,7 0 0 0 29.583,92.634 L 97.583,92.634 A 7,7 0 0 0 104.497,86.729 Z"
      fill="url(#green-wall)" transform="rotate(-9 23 64)"/>
<rect x="23" y="38" width="82" height="52" rx="7" fill="url(#green)"
      transform="rotate(-9 23 64)"/>

<!-- Purple card (front of the fan, flat), theta = 0 -->
<path d="M 105.000,83.000 A 7,7 0 0 1 98.000,90.000 L 30.000,90.000 A 7,7 0 0 1 23.000,83.000 L 23.000,45.000 L 23.000,47.667 L 23.000,85.667 A 7,7 0 0 0 30.000,92.667 L 98.000,92.667 A 7,7 0 0 0 105.000,85.667 Z"
      fill="url(#purple-wall)"/>
<g>
<rect x="23" y="38" width="82" height="52" rx="7" fill="url(#purple)"/>
<g fill="#ffffff">
<rect x="42" y="48" width="2" height="32"/>
<rect x="45" y="48" width="1" height="32"/>
<rect x="47" y="48" width="3" height="32"/>
<rect x="51" y="48" width="1" height="32"/>
<rect x="54" y="48" width="2" height="32"/>
<rect x="57" y="48" width="1" height="32"/>
<rect x="59" y="48" width="4" height="32"/>
<rect x="64" y="48" width="1" height="32"/>
<rect x="66" y="48" width="2" height="32"/>
<rect x="69" y="48" width="1" height="32"/>
<rect x="72" y="48" width="3" height="32"/>
<rect x="76" y="48" width="1" height="32"/>
<rect x="78" y="48" width="2" height="32"/>
<rect x="81" y="48" width="1" height="32"/>
<rect x="83" y="48" width="2" height="32"/>
</g>
</g>
</g>
</svg>
