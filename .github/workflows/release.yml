name: Release

# The FrogPak releaser (https://github.com/FrogPak/releaser) builds x86_64 and aarch64 Flatpak
# bundles. Tags are created on Forgejo (.forgejo/workflows/tag.yml) and carried here by the push
# mirror; a pushed v* tag builds and publishes a GitHub release carrying the bundles. Pushes to
# main and pull requests run the checks only.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  release:
    uses: FrogPak/releaser/.github/workflows/release.yml@v1
    permissions:
      contents: write
      id-token: write
    with:
      create-tags: false
      # Each version must equal the metainfo release; the first match in each file is its [package] version.
      version-files: |
        app/Cargo.toml: version = "([^"]+)"
        barkeep-core/Cargo.toml: version = "([^"]+)"
      # Ponds updated at once after a release, one owner/repository per line. Without the
      # POND_TOKEN secret they pick the release up at their next scheduled check.
      ponds: |
        ajdunevent/AJHub
    secrets:
      POND_TOKEN: ${{ secrets.POND_TOKEN }}
